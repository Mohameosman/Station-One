<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Station One — Control Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="viewport">
    <section class="dashboard-stage" id="dashboardStage" aria-label="Station One Operations Dashboard">
      <img class="dashboard-image" src="dashboard-reference.png" alt="Station One logistics dashboard" />

      <!-- Functional transparent interaction layer aligned to the approved design -->
      <button class="hotspot nav dashboard" data-action="dashboard" aria-label="لوحة التحكم"></button>
      <button class="hotspot nav operations" data-action="operations" aria-label="غرفة العمليات"></button>
      <button class="hotspot nav bookings" data-action="bookings" aria-label="الحجوزات"></button>
      <button class="hotspot nav trips" data-action="trips" aria-label="الرحلات"></button>
      <button class="hotspot nav fleet" data-action="fleet" aria-label="الأسطول"></button>
      <button class="hotspot nav drivers" data-action="drivers" aria-label="السائقون"></button>
      <button class="hotspot nav carriers" data-action="carriers" aria-label="الناقلون"></button>
      <button class="hotspot nav customers" data-action="customers" aria-label="العملاء"></button>
      <button class="hotspot nav docs" data-action="docs" aria-label="المستندات"></button>
      <button class="hotspot nav reports" data-action="reports" aria-label="التقارير والتحليلات"></button>
      <button class="hotspot nav alerts-nav" data-action="alerts" aria-label="التنبيهات"></button>
      <button class="hotspot nav settings" data-action="settings" aria-label="الإعدادات"></button>

      <input class="search-hotspot" id="searchInput" aria-label="البحث" placeholder="" />
      <button class="hotspot notification" data-action="notifications" aria-label="الإشعارات"></button>
      <button class="hotspot language" data-action="language" aria-label="اللغة"></button>
      <button class="hotspot profile" data-action="profile" aria-label="الملف الشخصي"></button>

      <button class="hotspot map-expand" data-action="map-expand" aria-label="تكبير الخريطة"></button>
      <button class="hotspot map-plus" data-action="map-plus" aria-label="تكبير"></button>
      <button class="hotspot map-minus" data-action="map-minus" aria-label="تصغير"></button>
      <button class="hotspot map-center" data-action="map-center" aria-label="توسيط الخريطة"></button>

      <button class="hotspot assign" data-action="assign" aria-label="تعيين الآن"></button>
      <button class="hotspot activity-all" data-action="activity-all" aria-label="عرض كل النشاط"></button>
      <button class="hotspot trips-all" data-action="trips-all" aria-label="عرض جميع الرحلات"></button>

      <button class="hotspot track t1" data-trip="TRP-10023" aria-label="تتبع الرحلة TRP-10023"></button>
      <button class="hotspot track t2" data-trip="TRP-10024" aria-label="تتبع الرحلة TRP-10024"></button>
      <button class="hotspot track t3" data-trip="TRP-10025" aria-label="تتبع الرحلة TRP-10025"></button>
      <button class="hotspot track t4" data-trip="TRP-10022" aria-label="تتبع الرحلة TRP-10022"></button>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <dialog id="modal" class="modal">
    <button class="modal-close" id="modalClose">×</button>
    <h2 id="modalTitle">Station One</h2>
    <p id="modalBody"></p>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
